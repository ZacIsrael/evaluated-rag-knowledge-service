# Configure the agent that joins the SPIRE server and identifies local Docker workloads.
# Expose the Workload API socket so registered workloads can obtain their identities.
agent {
  # Must match the server's trust domain exactly.
  trust_domain = "evaluated-rag.local"

  # Initial copy of the server's CA bundle. Export it from the server
  # and mount it here before starting the agent.
  trust_bundle_path = "/opt/spire/conf/agent/bootstrap.pem"

  # Reach the server by its Docker Compose service name and port.
  server_address = "spire-server"
  server_port    = "8081"

  # Persist agent state across container restarts.
  data_dir = "/var/lib/spire/agent"

  # Local Workload API socket. Application containers will need access
  # to this socket to obtain their own short-lived identities.
  socket_path = "/run/spire/agent/public/api.sock"

  log_level = "INFO"
}

plugins {
  # Corresponds to the server's join-token node attestor.
  NodeAttestor "join_token" {
    plugin_data {}
  }

  # Preserve the agent's keys in its persistent volume.
  KeyManager "disk" {
    plugin_data {
      directory = "/var/lib/spire/agent"
    }
  }

  # Identify calling workloads from their Docker container properties
  # so registrations can distinguish the API from the retriever.
  WorkloadAttestor "docker" {
    plugin_data {}
  }
}