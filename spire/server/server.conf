# Configure the authority that registers workloads and issues signed SPIFFE identities.
# Persist its registrations and signing keys so identities remain valid across restarts.
server {
  # All identities issued by this SPIRE server use this trust domain.
  # For example: spiffe://evaluated-rag.local/service/api
  trust_domain = "evaluated-rag.local"

  # Accept connections from the agent over the Compose network.
  bind_address = "0.0.0.0"
  bind_port    = "8081"

  # Persist the server's database and signing keys in a Docker volume.
  data_dir = "/var/lib/spire/server"

  # Local administrative API used to create registration entries.
  socket_path = "/tmp/spire-server/private/api.sock"

  log_level = "INFO"
}

plugins {
  # Store agent and workload registrations in a local SQLite database.
  DataStore "sql" {
    plugin_data {
      database_type     = "sqlite3"
      connection_string = "/var/lib/spire/server/datastore.sqlite3"
    }
  }

  # Let the development agent join using a server-generated,
  # single-use token. The token is supplied when the agent starts.
  NodeAttestor "join_token" {
    plugin_data {}
  }

  # Persist the keys used to sign workload identities.
  KeyManager "disk" {
    plugin_data {
      keys_path = "/var/lib/spire/server/keys.json"
    }
  }
}