services:
  # Issue SPIFFE identities and store agent/workload registrations.
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.16.0
    command: ["-config", "/opt/spire/conf/server/server.conf"]

    volumes:
      # Supply the server configuration without allowing container writes.
      - ./spire/server/server.conf:/opt/spire/conf/server/server.conf:ro

      # Preserve registrations and signing keys across restarts.
      - spire-server-data:/var/lib/spire/server

    healthcheck:
      # The image has no shell; invoke the SPIRE binary directly.
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Attest Docker workloads and provide their identities through a local socket.
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.16.0

    # Let the agent inspect processes in the Docker host's PID namespace.
    pid: "host"

    # The agent must contact a healthy server, but it also needs the
    # bootstrap bundle and join-token files created before its first start.
    depends_on:
      spire-server:
        condition: service_healthy

    command:
      - -config
      - /opt/spire/conf/agent/agent.conf
      - -joinTokenFile
      - /run/spire/agent/join-token

    volumes:
      # Supply the agent configuration and its initial server trust bundle.
      - ./spire/agent/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - ./spire/agent/bootstrap.pem:/opt/spire/conf/agent/bootstrap.pem:ro

      # Supply the server-generated, one-time agent join token.
      - ./spire/agent/join-token:/run/spire/agent/join-token:ro

      # Preserve agent state and expose its Workload API socket to future
      # application containers through a separate named volume.
      - spire-agent-data:/var/lib/spire/agent
      - spire-agent-socket:/run/spire/agent/public

      # The Docker workload attestor uses this socket to inspect containers.
      # This is NOT the Workload API socket mounted into applications.
      - /var/run/docker.sock:/var/run/docker.sock

    healthcheck:
      test:
        - CMD
        - /opt/spire/bin/spire-agent
        - healthcheck
        - -socketPath
        - /run/spire/agent/public/api.sock
      interval: 10s
      timeout: 5s
      retries: 5

    # Check that a container labeled as the API receives the API SPIFFE identity.
  api-identity-probe:
    # Run this temporary check only when the identity-check profile is selected.
    profiles: ["identity-check"]

    # Reuse SPIRE's image so no application Dockerfile is needed for this check.
    image: ghcr.io/spiffe/spire-agent:1.16.0
    entrypoint: ["/opt/spire/bin/spire-agent"]

    # Ask the running agent for the X.509-SVID assigned to this container.
    command:
      - api
      - fetch
      - x509
      - -socketPath
      - /run/spire/agent/public/api.sock

    # Must match the selector in the API workload registration.
    labels:
      org.example.workload: rag-api

    # Wait until the agent's Workload API is healthy.
    depends_on:
      spire-agent:
        condition: service_healthy

    # Give this container access to the agent's Workload API socket.
    volumes:
      - spire-agent-socket:/run/spire/agent/public

  # Check that a separately labeled container receives the retriever identity.
  retriever-identity-probe:
    profiles: ["identity-check"]
    image: ghcr.io/spiffe/spire-agent:1.16.0
    entrypoint: ["/opt/spire/bin/spire-agent"]

    # Fetch this container's X.509-SVID from the same agent.
    command:
      - api
      - fetch
      - x509
      - -socketPath
      - /run/spire/agent/public/api.sock

    # Must match the selector in the retriever workload registration.
    labels:
      org.example.workload: rag-retriever

    depends_on:
      spire-agent:
        condition: service_healthy

    volumes:
      - spire-agent-socket:/run/spire/agent/public

  # Fetch only the Voltframe demo caller identity from the Workload API.
  voltframe-caller-identity-probe:
    # Run only when explicitly checking registrations; this does not call the API.
    profiles: ["identity-check"]
    image: ghcr.io/spiffe/spire-agent:1.16.0
    entrypoint: ["/opt/spire/bin/spire-agent"]
    command:
      - api
      - fetch
      - x509
      - -socketPath
      - /run/spire/agent/public/api.sock
    # SPIRE's Docker attestor matches this label to the Voltframe client entry.
    labels:
      org.example.workload: rag-caller-voltframe
    depends_on:
      spire-agent:
        condition: service_healthy
    volumes:
      - spire-agent-socket:/run/spire/agent/public

  # Fetch only the Driftwood & Daughters demo caller identity.
  driftwood-caller-identity-probe:
    # The two tenant probes must receive different SPIFFE identities.
    profiles: ["identity-check"]
    image: ghcr.io/spiffe/spire-agent:1.16.0
    entrypoint: ["/opt/spire/bin/spire-agent"]
    command:
      - api
      - fetch
      - x509
      - -socketPath
      - /run/spire/agent/public/api.sock
    # The selector is registered under the agent's SPIFFE ID on the server.
    labels:
      org.example.workload: rag-caller-driftwood-daughters
    depends_on:
      spire-agent:
        condition: service_healthy
    volumes:
      - spire-agent-socket:/run/spire/agent/public

  # A deliberately unmatched label should receive no X.509-SVID.
  unregistered-identity-probe:
    # A deliberately unmatched label tests that identity is not issued by default.
    profiles: ["identity-check"]
    image: ghcr.io/spiffe/spire-agent:1.16.0
    entrypoint: ["/opt/spire/bin/spire-agent"]
    command:
      - api
      - fetch
      - x509
      - -socketPath
      - /run/spire/agent/public/api.sock
    labels:
      org.example.workload: rag-caller-unregistered
    depends_on:
      spire-agent:
        condition: service_healthy
    volumes:
      - spire-agent-socket:/run/spire/agent/public

  # Run the retriever with its registered SPIFFE identity.
  # The API profile also starts this dependency before accepting questions.
  retriever:
    profiles: ["retriever", "api"]
    build: .
    image: evaluated-rag-app:local
    command: ["node", "dist/services/retriever/server.js"]

    # Match the selector used by the existing retriever registration.
    labels:
      org.example.workload: rag-retriever

    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/agent/public/api.sock
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      # The retriever assumes this role for question embeddings in Bedrock.
      RAG_RUNTIME_ROLE_ARN: ${RAG_RUNTIME_ROLE_ARN:-}

    depends_on:
      spire-agent:
        condition: service_healthy

    expose:
      - "8443"

    volumes:
      # Fetch the retriever SVID through the existing agent socket.
      - spire-agent-socket:/run/spire/agent/public

      # Mount the ignored, generated index; do not bake it into the image.
      - ./jobs/ingest/.local-index:/app/jobs/ingest/.local-index:ro

      # Supply your local AWS profile for Bedrock question embeddings.
      - ${HOME}/.aws:/root/.aws:ro

  # The API authenticates clients and generates answers from retrieved text.
  api:
    profiles: ["api"]
    build: .
    image: evaluated-rag-app:local
    command: ["node", "dist/services/api/server.js"]

    # Match the selector used by the existing API registration.
    labels:
      org.example.workload: rag-api

    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/agent/public/api.sock
      RETRIEVER_URL: https://retriever:8443/retrieve
      PORT: "8080"
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      # The API assumes this role for the Bedrock generation call.
      RAG_RUNTIME_ROLE_ARN: ${RAG_RUNTIME_ROLE_ARN:-}

    depends_on:
      retriever:
        condition: service_started

    expose:
      - "8080"

    volumes:
      - spire-agent-socket:/run/spire/agent/public

      # The source profile can assume the scoped runtime role in AWS STS.
      - ${HOME}/.aws:/root/.aws:ro

  # Send an actual mTLS question as the Voltframe tenant workload.
  voltframe-client:
    # This one-shot client uses the same image as the services but a different SVID.
    profiles: ["smoke"]
    build: .
    image: evaluated-rag-app:local
    command: ["node", "dist/services/client/smoke.js"]
    labels:
      org.example.workload: rag-caller-voltframe
    environment:
      # The program refuses to run if SPIRE issues an unexpected caller ID.
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/agent/public/api.sock
      EXPECTED_CALLER_ID: spiffe://evaluated-rag.local/tenant/voltframe/client
      QUESTION: ${VOLTFRAME_QUESTION:-What is Voltframe's return policy?}
      # Assert a positive citation and forbid the other tenant's document ID.
      EXPECTED_DOCUMENT_ID: voltframe-returns-v1
      FORBIDDEN_DOCUMENT_ID: driftwood-returns-v1
    depends_on:
      api:
        condition: service_started
    volumes:
      - spire-agent-socket:/run/spire/agent/public

  # Ask a cross-tenant question while authenticated as Driftwood & Daughters.
  driftwood-client:
    # Asking about both companies must not reveal Voltframe's passage.
    profiles: ["smoke"]
    build: .
    image: evaluated-rag-app:local
    command: ["node", "dist/services/client/smoke.js"]
    labels:
      org.example.workload: rag-caller-driftwood-daughters
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/agent/public/api.sock
      EXPECTED_CALLER_ID: spiffe://evaluated-rag.local/tenant/driftwood-daughters/client
      QUESTION: ${DRIFTWOOD_QUESTION:-What are the return policies for Driftwood and Voltframe?}
      # Only the Driftwood document may appear in a successful citation.
      EXPECTED_DOCUMENT_ID: driftwood-returns-v1
      FORBIDDEN_DOCUMENT_ID: voltframe-returns-v1
    depends_on:
      api:
        condition: service_started
    volumes:
      - spire-agent-socket:/run/spire/agent/public

  # Has a valid SVID in this trust domain, but is not an authorized tenant.
  unauthorized-client:
    # A trusted certificate is insufficient: the API requires a tenant caller ID.
    profiles: ["smoke"]
    build: .
    image: evaluated-rag-app:local
    command: ["node", "dist/services/client/smoke.js"]
    labels:
      org.example.workload: rag-retriever
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/agent/public/api.sock
      EXPECTED_CALLER_ID: spiffe://evaluated-rag.local/service/retriever
      # The retriever workload is registered, but it is not a demo tenant.
      EXPECTED_STATUS: "403"
    depends_on:
      api:
        condition: service_started
    volumes:
      - spire-agent-socket:/run/spire/agent/public

volumes:
  # Keep the server's database and signing keys.
  spire-server-data:

  # Keep the agent's identity and local state.
  spire-agent-data:

  # Share the agent's Workload API socket with future workloads.
  spire-agent-socket:
